name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-windows:
    name: Verify (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend and guard tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify generated TypeScript bindings are up to date
        run: |
          npm run gen:types
          git diff --exit-code src/types/generated

      - name: Check banned APIs
        run: npm run check:banned-apis

      - name: Audit production npm dependencies
        run: npm audit --omit=dev

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run Rust unit and integration tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check licenses and bans (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          arguments: --manifest-path src-tauri/Cargo.toml check

      - name: Audit Rust dependencies (cargo-audit)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lockfile: src-tauri/Cargo.lock
